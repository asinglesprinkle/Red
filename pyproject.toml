[project]
name = "red"
version = "0.1.0"
description = "Talk to a technical project manager, get a reviewed Linear project, then let Forman turn it into issues."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "claude-agent-sdk>=0.1.0",
  # Forman master as of forman.progress, which Red imports directly: the live
  # display and the type-ahead guard live there now, shared by both CLIs
  # rather than duplicated into this one. Earlier commits carry on_activity
  # through run_conversation and push_interactive, which is what lets both
  # halves of Red show that an agent is working rather than hung.
  # Further back is the merge of #2, which first carried forman.review (spelled
  # foreman.review), the seam Red is built on. Pinned to a SHA rather than to
  # master: nothing in Forman is exported from __init__ and it makes no
  # stability promise, so tracking a branch would make Red depend on whatever
  # happened to be pushed. Bump this deliberately.
  "forman @ git+https://github.com/cmichaelsd/Forman@19b677f6dd100cc1e84852e2dd8f6f91a50a58f2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
red = "red.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/red"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project]
name = "red"
version = "0.1.0"
description = "Talk to a product manager, get a reviewed Linear project, then let Foreman turn it into issues."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "claude-agent-sdk>=0.1.0",
  # Foreman master as of the merge of #2, which is the first commit carrying
  # foreman.review, the seam Red is built on. Pinned to a SHA rather than to
  # master: nothing in Foreman is exported from __init__ and it makes no
  # stability promise, so tracking a branch would make Red depend on whatever
  # happened to be pushed. Bump this deliberately.
  "foreman @ git+https://github.com/cmichaelsd/Foreman@f352eb2ea4563decf4f6b3dbbd84f93f0661e4e0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
red = "red.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/red"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project]
name = "red"
version = "0.1.0"
description = "Talk to a technical project manager, get a reviewed Linear project, then let Forman turn it into issues."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "claude-agent-sdk>=0.1.0",
  # Forman master as of the type-ahead guard on its own gate. Red does not
  # import forman.cli, so nothing here depends on that commit; it is pinned
  # anyway because installing Forman puts a `forman` script in this venv, and
  # a stale one would be a gate without the guard. The commit before it is
  # on_activity reaching push_interactive, which Red does depend on: it is
  # what lets both halves show that an agent is working rather than hung.
  # Further back is the merge of #2, which first carried forman.review (spelled
  # foreman.review), the seam Red is built on. Pinned to a SHA rather than to
  # master: nothing in Forman is exported from __init__ and it makes no
  # stability promise, so tracking a branch would make Red depend on whatever
  # happened to be pushed. Bump this deliberately.
  "forman @ git+https://github.com/cmichaelsd/Forman@ac318d69b6c0f0c77754103674a85347985fe4da",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
red = "red.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/red"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
